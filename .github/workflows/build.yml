name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Hoisted to job level deliberately: a step's own `env:` block is not
      # visible to that same step's `if:` condition.
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0 platform-tools"

      # Runs Gradle directly at a pinned version, so the repo needs no
      # gradle-wrapper.jar committed to it.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Report versions
        run: |
          gradle --version
          echo "ANDROID_HOME=$ANDROID_HOME"

      # Only runs if you have added the signing secrets. Without them the
      # release APK is signed with the debug key instead, which still installs
      # fine — it just cannot go to the Play Store.
      - name: Decode keystore
        if: env.KEYSTORE_BASE64 != ''
        run: echo "$KEYSTORE_BASE64" | base64 -d > release.keystore

      - name: Build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace

      - name: Name the artefacts
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/*.apk        out/longhand-debug.apk
          cp app/build/outputs/apk/release/*.apk      out/longhand-release.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: longhand-apk
          path: out/*.apk
          retention-days: 30

      # Attaches the APK to a GitHub Release when you push a v* tag, giving you
      # a permanent link you can install from on any phone.
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
